<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Courses - Study Pilot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #243b67;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .course-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 38px;
        }

        .course-card h2 {
            color: #243b67;
            font-size: 21px;
        }

        .level {
            color: #287a55;
            font-weight: bold;
        }

        .open-button {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 16px;
            background: #3157c8;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .open-button:hover {
            background: #203f9b;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            color: #3157c8;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">

        <a class="back-button" href="{{ url_for('dashboard') }}">
            ← Back to Dashboard
        </a>

        <h1>📚 Study Pilot Courses</h1>

        <p class="subtitle">
            Choose a course and start learning!
        </p>

        <div class="course-grid">

            {% for course in courses %}

            <div class="course-card">

                <div class="icon">
                    {{ course.icon }}
                </div>

                <h2>{{ course.name }}</h2>

                <p>{{ course.description }}</p>

                <p class="level">
                    Level: {{ course.level }}
                </p>

                <p>
                    Lessons: {{ course.lessons | length }}
                </p>

                <a class="open-button"
                   href="{{ url_for('course_detail', course_id=course.id) }}">
                    Open Course →
                </a>

            </div>

            {% endfor %}

        </div>
    </div>
</body>
</html>
